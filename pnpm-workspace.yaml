packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: false
minimumReleaseAgeExclude:
  - "@tailwindcss/node@4.3.2"
  - "@tailwindcss/oxide-android-arm64@4.3.2"
  - "@tailwindcss/oxide-darwin-arm64@4.3.2"
  - "@tailwindcss/oxide-darwin-x64@4.3.2"
  - "@tailwindcss/oxide-freebsd-x64@4.3.2"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.2"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.2"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.2"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.2"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.2"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.2"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.2"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.2"
  - "@tailwindcss/oxide@4.3.2"
  - "@tailwindcss/vite@4.3.2"
  - tailwindcss@4.3.2
  - "@shikijs/core@4.3.1"
  - "@shikijs/engine-javascript@4.3.1"
  - "@shikijs/engine-oniguruma@4.3.1"
  - "@shikijs/langs@4.3.1"
  - "@shikijs/primitive@4.3.1"
  - "@shikijs/themes@4.3.1"
  - "@shikijs/types@4.3.1"
  - shiki@4.3.1
  - next@16.3.8
  - source-map-js@1.2.2
  - sharp@0.35.5
overrides:
  "source-map-js@<1.2.2": "1.2.2"
  "sharp@<0.35.5": "0.35.5"
auditConfig:
  ignoreGhsas:
    # Development tooling only; no published fixes as of 2026-10-11.
    # Remove each exception once its patched version becomes available.
    # https://github.com/advisories/GHSA-vfj7-8cjw-p6xm (braces)
    - GHSA-vfj7-8cjw-p6xm
    # https://github.com/advisories/GHSA-hp3w-g68c-fv3c (sprintf-js)
    - GHSA-hp3w-g68c-fv3c
