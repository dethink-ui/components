  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="06-one-command"]');
      var q = function (s) { return root.querySelector(s); };
      var term = q(".f06-one-command-term");
      var key = q(".f06-one-command-key");
      var cmdEl = q(".f06-one-command-cmd");
      var pkgEl = q(".f06-one-command-pkg");
      var caret = q(".f06-one-command-caret");
      var out = q(".f06-one-command-out");
      var plate = q(".f06-one-command-plate");
      var img = q(".f06-one-command-plate img");
      var kicker = q(".f06-one-command-kicker");
      var tags = root.querySelectorAll(".f06-one-command-tag, .f06-one-command-sep");

      var DUR = 4;
      var BEAT = 60 / 128; // 0.469s
      var CMD = "npx shadcn@latest add ";
      var PKG = "@dethink/data-table";
      var FULL = CMD + PKG;

      // Keystroke schedule (discrete states): fast clusters, small breaths at word breaks.
      var T_TYPE = 0.36;
      var STEP = 0.029;
      var times = [];
      var t = T_TYPE;
      for (var i = 0; i < FULL.length; i++) {
        times.push(t);
        t += STEP;
        if (i === 3 || i === 21) t += 0.08; // after "npx " and "add "
      }
      var T_TYPED = times[times.length - 1];         // ~1.64s
      var T_ENTER = 4 * BEAT - 0.03;                   // ~1.845s — beat 4
      var T_OUT = T_ENTER + 0.13;
      var T_PLATE = 5 * BEAT + 0.05;                   // ~2.39s — beat 5
      var T_TAGS = 7 * BEAT;                           // ~3.28s — beat 7

      function countAt(time) {
        for (var k = times.length - 1; k >= 0; k--) {
          if (time >= times[k]) return k + 1;
        }
        return 0;
      }

      var tl = gsap.timeline({ paused: true });

      // Driver: typed text + caret (solid while typing, blinks on holds, gone after enter)
      var drv = { t: 0 };
      tl.to(drv, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var n = countAt(drv.t);
          cmdEl.textContent = FULL.slice(0, Math.min(n, CMD.length));
          pkgEl.textContent = n > CMD.length ? FULL.slice(CMD.length, n) : "";
          var on;
          if (drv.t >= T_ENTER) on = false;
          else if (drv.t >= T_TYPE && drv.t <= T_TYPED + 0.08) on = true;
          else on = Math.sin((drv.t / 0.53) * Math.PI * 2) > -0.2;
          caret.style.opacity = on ? "1" : "0";
        }
      }, 0);

      // Scene 1 — terminal arrives (hero visible well before 0.5s), camera still
      tl.fromTo(term, { opacity: 0, y: 28, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power4.out" }, 0);
      tl.fromTo(kicker, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 0.12);

      // Scene 2 — enter: linear press, smooth long-tail release (no overshoot)
      tl.to(term, { scale: 0.965, duration: 0.1, ease: "power1.in" }, T_ENTER);
      tl.to(term, { scale: 1, duration: T_PLATE - (T_ENTER + 0.1), ease: "power4.out" }, T_ENTER + 0.1);
      tl.fromTo(term, { borderColor: "#1B3236" }, { borderColor: "#B6F06B", duration: 0.08, ease: "none", immediateRender: false }, T_ENTER);
      tl.to(term, { borderColor: "#1B3236", duration: 0.45, ease: "power2.out" }, T_ENTER + 0.08);
      tl.fromTo(key, { backgroundColor: "rgba(182,240,107,0)", color: "#6F8B87", borderColor: "#1B3236" },
        { backgroundColor: "rgba(182,240,107,1)", color: "#071D1C", borderColor: "#B6F06B", duration: 0.07, ease: "none", immediateRender: false }, T_ENTER);
      tl.to(key, { backgroundColor: "rgba(182,240,107,0)", color: "#6F8B87", borderColor: "#1B3236", duration: 0.5, ease: "power2.out" }, T_ENTER + 0.1);
      tl.fromTo(out, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power4.out" }, T_OUT);

      // Scene 3 — plate springs up out of the terminal (card-morph-anchor: uniform scale + radius)
      tl.to(term, { scale: 0.9, y: 40, opacity: 0.28, duration: 0.8, ease: "power4.out" }, T_PLATE);
      tl.fromTo(plate,
        { scale: 0.42, y: 96, borderRadius: 28 },
        { scale: 1, y: 0, borderRadius: 12, duration: 0.9, ease: "expo.out" }, T_PLATE);
      tl.fromTo(plate, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, T_PLATE);
      tl.fromTo(img, { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out" }, T_PLATE + 0.12);

      // Tags pop on the next beat, then a quiet push on the plate through the hold
      tl.fromTo(tags, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out", stagger: 0.07 }, T_TAGS);
      tl.to(plate, { scale: 1.012, duration: DUR - (T_PLATE + 0.9), ease: "none" }, T_PLATE + 0.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-one-command"] = tl;
    })();
  </script>
