  <script>
    (function () {
      // 128 bpm beat grid — one beat = 0.469s. Every onset reads from this array.
      const BEAT = 60 / 128;
      const B = [0, BEAT * 2, BEAT * 4, BEAT * 5]; // stop · rebuilding · the same UI. · echo collapse
      const tl = gsap.timeline({ paused: true });

      // Stable resting baselines before any tween runs
      tl.set(["#s01-stop", "#s01-rebuild", "#s01-rebuild-ghost", "#s01-same", "#s01-echo-a", "#s01-echo-b", "#s01-echo-c"], { opacity: 0, x: 0, y: 0, scale: 1 }, 0);

      // ── Background plate: slow continuous push under everything (inner img) ──
      tl.fromTo("#s01-plate", { scale: 1.0 }, { scale: 1.08, duration: 3, ease: "none" }, 0);

      // Jump-cut offsets on each beat (outer wrapper, instant sets = hard cuts)
      tl.set("#s01-plate-jump", { x: 120, y: -40, rotation: -7, scale: 1.0 }, 0);
      // Beat 2 glitch flicker then new offset
      tl.set("#s01-plate-jump", { x: -260, y: 90, rotation: 5, scale: 1.25, opacity: 1 }, B[1]);
      tl.set("#s01-plate-jump", { x: -200, opacity: 0.4 }, B[1] + 0.035);
      tl.set("#s01-plate-jump", { x: -300, y: 70, opacity: 1 }, B[1] + 0.07);
      tl.set("#s01-plate-jump", { x: -240, y: 96, opacity: 0.6 }, B[1] + 0.105);
      tl.set("#s01-plate-jump", { x: -260, y: 90, opacity: 1 }, B[1] + 0.14);
      // Beat 4 new offset
      tl.set("#s01-plate-jump", { x: 340, y: -120, rotation: -3, scale: 1.45 }, B[2]);
      tl.set("#s01-plate-jump", { x: 300, opacity: 0.5 }, B[2] + 0.035);
      tl.set("#s01-plate-jump", { x: 340, opacity: 1 }, B[2] + 0.07);
      // Beat 5 (collapse) small snap
      tl.set("#s01-plate-jump", { x: 20, y: -30, rotation: -5, scale: 1.3 }, B[3]);

      // ── Scene 1: "stop" slams in (scale + blur slam) ──
      tl.fromTo(
        "#s01-stop",
        { opacity: 0, scale: 1.6, filter: "blur(22px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
        B[0]
      );
      tl.fromTo("#s01-stop", { scale: 1 }, { scale: 1.035, duration: B[1] - 0.42, ease: "none", immediateRender: false }, 0.42);

      // ── Scene 2: hard-cut word swap → "rebuilding" (side snap + chroma snap-clean) ──
      tl.set("#s01-stop", { opacity: 0 }, B[1]);
      tl.fromTo(
        "#s01-rebuild",
        { opacity: 1, x: 260, filter: "blur(14px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" },
        B[1]
      );
      tl.fromTo(
        "#s01-rebuild-ghost",
        { opacity: 0.85, x: 300 },
        { opacity: 0, x: 0, duration: 0.3, ease: "expo.out" },
        B[1] + 0.02
      );
      tl.fromTo("#s01-rebuild", { scale: 1.0 }, { scale: 1.04, duration: B[2] - B[1] - 0.05, ease: "none", immediateRender: false }, B[1] + 0.05);

      // ── Scene 3: swap → "the same UI." with stuttering ghost echoes that collapse ──
      tl.set("#s01-rebuild", { opacity: 0 }, B[2]);
      tl.fromTo(
        "#s01-same",
        { opacity: 1, y: 90, scale: 1.12, filter: "blur(12px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
        B[2]
      );
      // Echo stack: stutter on sub-beats (quarter beats), then collapse into the line
      const Q = BEAT / 4;
      const echoes = [
        { id: "#s01-echo-a", o: [-150, -110, -170], op: 0.9 },
        { id: "#s01-echo-b", o: [-300, -240, -330], op: 0.6 },
        { id: "#s01-echo-c", o: [-450, -380, -500], op: 0.35 },
      ];
      echoes.forEach((e, i) => {
        tl.set(e.id, { opacity: e.op, y: e.o[0], x: 0 }, B[2] + Q * 0.5);
        tl.set(e.id, { y: e.o[1], x: i % 2 ? 14 : -14 }, B[2] + Q * 1.5);
        tl.set(e.id, { y: e.o[2], x: i % 2 ? -10 : 10 }, B[2] + Q * 2.5);
        tl.set(e.id, { y: e.o[0], x: 0 }, B[2] + Q * 3.5);
        tl.fromTo(
          e.id,
          { y: e.o[0], opacity: e.op },
          { y: 0, opacity: 0, duration: 0.28, ease: "expo.out", immediateRender: false },
          B[3]
        );
      });
      // Collapse impact: the solid line takes a tiny punch as echoes land in it
      tl.fromTo("#s01-same", { scale: 1.035 }, { scale: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, B[3] + 0.04);

      // Hold with subtle deterministic jitter
      const JIT = [[2, -1], [-2, 1], [1, 2], [-1, -2], [2, 1], [-2, -1], [1, -2], [0, 0]];
      const jStart = B[3] + 0.36;
      JIT.forEach((p, i) => {
        tl.set("#s01-same", { x: p[0], y: p[1] }, jStart + i * 0.05);
      });

      // Mono chrome tag top-right (lands with Scene 3)
      tl.fromTo("#s01-tag", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, B[2] + 0.06);
      tl.fromTo("#s01-rule", { opacity: 0, scaleX: 0, transformOrigin: "100% 50%" }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "expo.out" }, B[2] + 0.12);

      // Pad timeline to full frame length
      tl.set({}, {}, 3);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-stop-rebuilding"] = tl;
    })();
  </script>
