  <div id="root" data-composition-id="04-motion-included" data-width="1920" data-height="1080" data-duration="4.4">
    <!-- Track 0: full-bleed effects montage (hard cuts on the beat) -->
    <div id="f04mi-bg" class="clip" data-start="0" data-duration="4.4" data-track-index="0">
      <div class="f04mi-layer f04mi-crop-card" id="f04mi-l-aurora"><img src="assets/ui-aurora-background.png" alt="" /></div>
      <div class="f04mi-layer f04mi-crop-mesh" id="f04mi-l-mesh"><img src="assets/ui-liquid-mesh-background.png" alt="" /></div>
      <div class="f04mi-layer f04mi-crop-orbit" id="f04mi-l-orbit"><img src="assets/ui-orbital-glow-background.png" alt="" /></div>

    <!-- Track 2: type lockup -->
    <div id="f04mi-lockup-layer" class="clip" data-start="0" data-duration="4.4" data-track-index="2">
      <div id="f04mi-lockup">
        <div id="f04mi-kicker"><span class="f04mi-slash">/</span>Effects &amp; Backgrounds</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "04-motion-included";
      var BEAT = 60 / 128; // 0.46875s
      var DOWNBEAT = 5 * BEAT; // 2.344s — "included." slam + aurora freeze

      var tl = gsap.timeline({ paused: true });
      var q = function (id) { return document.getElementById(id); };

      // ---------- Scene 1: hard cuts on the beat grid (accelerating into the downbeat) ----------
      var CUTS = [
        { id: "f04mi-l-aurora", at: 0 },
        { id: "f04mi-l-mesh", at: 1 * BEAT },
        { id: "f04mi-l-orbit", at: 2 * BEAT },
        { id: "f04mi-l-stars", at: 3 * BEAT },
        { id: "f04mi-l-beams", at: 3.5 * BEAT },
        { id: "f04mi-l-dots", at: 4 * BEAT }
      ];
      CUTS.forEach(function (cut, i) {
        var el = q(cut.id);
        el.style.zIndex = String(i + 1);
        // Hard cut: instant opacity switch; each later layer covers the previous one.
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none", immediateRender: true }, cut.at);
        // Punch-in on the cut: 1.08 → 1.0, long-tail expo out.
        tl.fromTo(el, { scale: 1.08 }, { scale: 1, duration: 0.6, ease: "expo.out" }, cut.at);
      });
      // Freeze on the downbeat: hard cut back to the aurora layer by dropping every layer above it.
      CUTS.slice(1).forEach(function (cut) {
        tl.fromTo(q(cut.id), { opacity: 1 }, { opacity: 0, duration: 0.001, ease: "none", immediateRender: false }, DOWNBEAT);
      });
      tl.fromTo(q("f04mi-l-aurora"), { scale: 1.05 }, { scale: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, DOWNBEAT);

      // ---------- Scene 2: "motion" per-char build (content-driven sequencing) ----------
      // Pre-computed start times from content: each char holds half a beat, starting on 0.6s.
      var WORD = "motion";
      var motionEl = q("f04mi-motion");
      var START = 0.6;
      var PER_CHAR = BEAT / 2;
      var cumulative = START;
      var CHAR_TIMELINE = WORD.split("").map(function (ch) {
        var span = document.createElement("span");
        span.className = "f04mi-ch";
        span.textContent = ch;
        motionEl.appendChild(span);
        var entry = { el: span, start: cumulative };
        cumulative += PER_CHAR;
        return entry;
      });

      // Mono kicker slides in with the first letter.
      tl.fromTo(
        q("f04mi-kicker"),
        { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: 0.7, ease: "power4.out" },
        START
      );

      CHAR_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, yPercent: 38, scale: 1.18, filter: "blur(14px)" },
          { opacity: 1, yPercent: 0, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
          entry.start
        );
      });

      // Lockup rides lower (centred on "motion") during the build, then lifts as "included." lands.
      tl.fromTo(
        q("f04mi-lockup"),
        { y: 120 },
        { y: 0, duration: 0.7, ease: "expo.out" },
        DOWNBEAT
      );

      // ---------- Scene 3: downbeat slam — "included." + aurora freeze + dim ----------
      tl.fromTo(
        q("f04mi-included"),
        { opacity: 0, scale: 1.6, filter: "blur(18px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
        DOWNBEAT
      );
      // Impact kick on "motion" as the second line hits.
      tl.fromTo(
        motionEl,
        { scale: 1 },
        { scale: 0.97, duration: 0.08, ease: "power2.out", immediateRender: false },
        DOWNBEAT + 0.06
      );
      tl.to(motionEl, { scale: 1, duration: 0.6, ease: "expo.out" }, DOWNBEAT + 0.14);

      // Background dims ~40% so the lockup reads.
      tl.fromTo(q("f04mi-scrim"), { opacity: 0.38 }, { opacity: 0.55, duration: 0.45, ease: "power3.out", immediateRender: false }, DOWNBEAT);
      tl.fromTo(q("f04mi-vignette"), { opacity: 0.6 }, { opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, DOWNBEAT);

      // Hold: a barely-there settle keeps the still frame alive without reading as motion.
      tl.fromTo(
        q("f04mi-lockup-layer"),
        { scale: 1 },
        { scale: 1.012, duration: 4 - (DOWNBEAT + 0.7), ease: "none", immediateRender: false },
        DOWNBEAT + 0.7
      );

      // Pad the timeline to the full frame duration.
      tl.set({}, {}, 4);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
