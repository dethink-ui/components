    <!-- Track 0: dark ground + hairline grid -->
    <div id="f03cb-bg" class="clip" data-start="0" data-duration="5.4" data-track-index="0">

    <div id="f03cb-camlayer" class="clip" data-start="0" data-duration="5.4" data-track-index="1">

        <div class="f03cb-plate" id="f03cb-p1"><img src="assets/ui-command-palette.png" alt="" /><div class="f03cb-chip">/ Command Palette</div><div class="f03cb-dim"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "03-component-blitz";
      var BEAT = 60 / 128; // 0.46875s
      var q = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });

      // Stage centre for plates (px, inside the 1920x1080 frame)
      var CX = 960, CY = 440;

      // Plates in arrival order. Hero sizes preserve the natural PNG aspect ratio.
      var P = [
        { ar: 1502 / 860,  w: 1150 },          // data table — first + largest
        { ar: 1502 / 1144, h: 680 },           // command palette
        { ar: 1502 / 878,  w: 1000 },          // calendar
        { ar: 1502 / 1482, h: 680 },           // chat
        { ar: 1502 / 1488, h: 680 },           // sidebar shell
        { ar: 1502 / 992,  w: 1000 },          // timeline
        { ar: 1918 / 2038, h: 680 }            // slot planner
      ];
      P.forEach(function (p, i) {
        if (p.w) { p.h = p.w / p.ar; } else { p.w = p.h * p.ar; }
        p.el = q("f03cb-p" + i);
        p.chip = p.el.querySelector(".f03cb-chip");
        p.dim = p.el.querySelector(".f03cb-dim");
        p.el.style.width = p.w.toFixed(1) + "px";
        p.el.style.height = p.h.toFixed(1) + "px";
        p.el.style.marginLeft = (-p.w / 2).toFixed(1) + "px";
        p.el.style.marginTop = (-p.h / 2).toFixed(1) + "px";
        p.el.style.zIndex = String(10 + i);
        // entry side: even from right (+1), odd from left (-1); pushed back toward its own side
        p.dir = i % 2 === 0 ? 1 : -1;
      });

      // ---------- Assembled 4+3 grid (row heights fitted to aspect ratios) ----------
      var GAP = 24;
      var ROWS = [
        { H: 380, top: 73,  ids: [1, 3, 4, 6] },   // command · chat · sidebar · slot planner
        { H: 330, top: 477, ids: [0, 2, 5] }       // data table · calendar · timeline
      ];
      var lines = q("f03cb-lines");
      var hairlines = [];
      var gridLeft = 1e9, gridRight = -1e9;
      ROWS.forEach(function (row) {
        var total = row.ids.reduce(function (s, id) { return s + row.H * P[id].ar; }, 0) + GAP * (row.ids.length - 1);
        var x = CX - total / 2;
        gridLeft = Math.min(gridLeft, x);
        gridRight = Math.max(gridRight, x + total);
        row.ids.forEach(function (id, k) {
          var gw = row.H * P[id].ar;
          P[id].gx = x + gw / 2 - CX;
          P[id].gy = row.top + row.H / 2 - CY;
          P[id].gs = row.H / P[id].h;
          x += gw;
          if (k < row.ids.length - 1) {
            var v = document.createElement("div");
            v.className = "f03cb-hl f03cb-hl-v";
            v.style.left = (x + GAP / 2).toFixed(1) + "px";
            v.style.top = (row.top + 6) + "px";
            v.style.height = (row.H - 12) + "px";
            lines.appendChild(v);
            hairlines.push({ el: v, axis: "y" });
            x += GAP;
          }
        });
      });
      var hz = document.createElement("div");
      hz.className = "f03cb-hl f03cb-hl-h";
      hz.style.left = (gridLeft - 30).toFixed(1) + "px";
      hz.style.width = (gridRight - gridLeft + 60).toFixed(1) + "px";
      hz.style.top = (ROWS[0].top + ROWS[0].H + GAP / 2) + "px";
      lines.appendChild(hz);
      hairlines.unshift({ el: hz, axis: "x" });

      // ---------- depth levels for plates punched back during the blitz ----------
      var LV = [
        null,
        { x: 600, y: 40,   s: 0.56, dim: 0.45, ry: 14 },
        { x: 700, y: -200, s: 0.44, dim: 0.6,  ry: 18 },
        { x: 740, y: 250,  s: 0.36, dim: 0.7,  ry: 20 },
        { x: 760, y: -290, s: 0.30, dim: 0.78, ry: 22 },
        { x: 770, y: 290,  s: 0.27, dim: 0.82, ry: 22 },
        { x: 770, y: 0,    s: 0.24, dim: 0.86, ry: 22 }
      ];

      // Background: slow drift of the hairline grid under everything
      tl.fromTo("#f03cb-hairgrid", { x: 0, y: 0 }, { x: -48, y: -24, duration: 5, ease: "none" }, 0);
      // Camera: slow push-in underneath the whole shot
      tl.fromTo("#f03cb-cam", { scale: 1 }, { scale: 1.035, duration: 5, ease: "none" }, 0);

      // ---------- Scenes 1+2: one arrival per beat, previous plate punched back ----------
      var ENTRY = 0.46;
      var ARRIVE = [0];
      for (var k = 1; k < P.length; k++) ARRIVE.push(1.5 * BEAT + (k - 1) * BEAT); // 0.703, 1.172 … 3.047

      P.forEach(function (p, i) {
        var at = ARRIVE[i];
        var d = p.dir;
        // slam in with motion-blur streak (x-stretch + 18px surface blur), tilted in 3D
        tl.fromTo(p.el,
          { x: d * 1150, y: 0, scaleX: 1.14, scaleY: 0.96, rotationY: d * -24, rotationZ: 0, opacity: 0, filter: "blur(18px)" },
          { x: 0, y: 0, scaleX: 1, scaleY: 1, rotationY: d * -6, opacity: 1, filter: "blur(0px)", duration: ENTRY, ease: "expo.out", immediateRender: true },
          at);
        // chip pops beside the top-left corner
        tl.fromTo(p.chip,
          { scale: 0.6, opacity: 0, x: -12 },
          { scale: 1, opacity: 1, x: 0, duration: 0.32, ease: "expo.out", immediateRender: true },
          at + 0.14);

        // on every later arrival this plate steps one level deeper in Z (cut-the-curve: same direction as the incoming move)
        for (var j = i + 1; j < P.length; j++) {
          var lv = LV[Math.min(j - i, LV.length - 1)];
          var side = d; // incoming plate travels toward this plate's side
          tl.to(p.el, {
            x: side * lv.x, y: lv.y, scaleX: lv.s, scaleY: lv.s, rotationY: side * -lv.ry,
            duration: 0.42, ease: j - i === 1 ? "power4.out" : "expo.out"
          }, ARRIVE[j]);
          tl.to(p.dim, { opacity: lv.dim, duration: 0.42, ease: "expo.out" }, ARRIVE[j]);
        }
      });

      // ---------- Scene 3: snap into the 4+3 grid (center-outward stagger) ----------
      var SNAP = 7.5 * BEAT; // 3.516s
      var order = P.map(function (p, i) { return i; }).sort(function (a, b) {
        var da = Math.hypot(P[a].gx, P[a].gy), db = Math.hypot(P[b].gx, P[b].gy);
        return da - db;
      });
      order.forEach(function (id, n) {
        var p = P[id];
        var t = SNAP + n * 0.05;
        tl.to(p.el, {
          x: p.gx, y: p.gy, scaleX: p.gs, scaleY: p.gs, rotationY: 0,
          duration: 0.7, ease: "expo.out"
        }, t);
        tl.to(p.dim, { opacity: 0, duration: 0.5, ease: "power3.out" }, t);
        // counter-scale the chip so the label stays legible on the small tile
        tl.to(p.chip, { scale: 0.62 / p.gs, duration: 0.7, ease: "expo.out" }, t);
      });

      // lime hairlines draw in between the cells
      hairlines.forEach(function (h, n) {
        var from = h.axis === "x" ? { scaleX: 0, opacity: 0 } : { scaleY: 0, opacity: 0 };
        var to = h.axis === "x" ? { scaleX: 1, opacity: 0.9 } : { scaleY: 1, opacity: 0.9 };
        to.duration = 0.5; to.ease = "expo.out"; to.immediateRender = true;
        tl.fromTo(h.el, from, to, SNAP + 0.3 + n * 0.04);
      });

      // headline slams across the grid centre on a dark band
      var HEAD = 8.5 * BEAT; // 3.984s
      // chips under the band step aside so no label collides with the headline
      tl.to(["#f03cb-p2 .f03cb-chip", "#f03cb-p5 .f03cb-chip"], { opacity: 0, duration: 0.15, ease: "power2.out" }, HEAD - 0.05);
      tl.fromTo("#f03cb-band", { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.3, ease: "expo.out", immediateRender: true }, HEAD);
      tl.fromTo("#f03cb-w1",
        { x: -220, scale: 1.18, opacity: 0, filter: "blur(10px)" },
        { x: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out", immediateRender: true },
        HEAD + 0.04);
      tl.fromTo("#f03cb-w2",
        { x: 220, scale: 1.18, opacity: 0, filter: "blur(10px)" },
        { x: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out", immediateRender: true },
        HEAD + 0.1);

      // hold with subtle deterministic jitter (~0.6s)
      var JIT = [[2, -1], [-1, 2], [1, 1], [-2, 0], [0, -2], [2, 1], [-1, -1], [1, -2], [-2, 1], [0, 0]];
      var J0 = 4.4;
      JIT.forEach(function (v, n) {
        var t = J0 + n * (0.6 / JIT.length);
        tl.set("#f03cb-head", { y: v[1] * 1.5, x: v[0] * 1.5 }, t);
        tl.set("#f03cb-camlayer", { x: v[0], y: v[1] }, t);
      });

      // pad to the full frame duration
      tl.set({}, {}, 5);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
