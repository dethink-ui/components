  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "07-the-wall";
      var DUR = 3.5;
      var BEAT = 60 / 128; // 0.46875s — 128 bpm grid drives every onset
      var q = function (s) { return document.getElementById("f" + ID + "-" + s); };
      var cam = q("cam");
      var wall = q("wall");

      // Wall geometry (authored, deterministic): tile 540x340, gap 26, 6 cols x 4 rows.
      var TW = 540, TH = 340, GAP = 26;
      var WALL_W = 6 * TW + 5 * GAP, WALL_H = 4 * TH + 3 * GAP;
      // Row parallax: alternate rows travel in opposite directions, different depths.
      var ROW_FROM = [-380, 260, -320, 420];
      var ROW_TO = [-70, 60, -50, 80];

      // Hero (carousel) = row 1, col 2. Its centre in wall space at t=0.
      var HERO_X0 = 2 * (TW + GAP) + TW / 2 + ROW_FROM[1];
      var HERO_Y0 = 1 * (TH + GAP) + TH / 2;
      var WALL_CX = WALL_W / 2, WALL_CY = WALL_H / 2 - 20;

      var S0 = 3.72, S_PRE = 3.42, S1 = 0.66; // open full-bleed -> gentle dwell pull -> wide
      var cstate = { u: 0, pre: 0 };

      function render() {
        var sPre = S0 + (S_PRE - S0) * cstate.pre;
        var u = cstate.u;
        var s = Math.exp(Math.log(sPre) + (Math.log(S1) - Math.log(sPre)) * u);
        var px = HERO_X0 + (WALL_CX - HERO_X0) * u;
        var py = HERO_Y0 + (WALL_CY - HERO_Y0) * u;
        var rx = 18 * u, rz = -8 * u;
        cam.style.transform = "scale(" + s + ") rotateX(" + rx + "deg) rotateZ(" + rz + "deg)";
        wall.style.transform = "translate(" + (-px) + "px," + (-py) + "px)";
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });

      // Scene 1 (0 - 1 beat): tight on the carousel plate, a slow dwell pull (<10%).
      tl.fromTo(cstate, { pre: 0 }, { pre: 1, duration: BEAT, ease: "none", onUpdate: render }, 0);

      // Scene 2 (beat 1 - ~1.8s): ONE fast decelerating pull-back into the tilted wall. Camera locks after.
      tl.fromTo(cstate, { u: 0 }, { u: 1, duration: 1.36, ease: "expo.out", onUpdate: render, immediateRender: false }, BEAT);

      // Speed blur riding the burst's attack, resolving as it decelerates.
      tl.fromTo(q("blur"), { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.14, ease: "power2.out" }, BEAT);
      tl.fromTo(q("blur"), { filter: "blur(5px)" }, { filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false }, BEAT + 0.14);

      // Rows settle in parallax — one long expo tail each, so the wall keeps drifting to the end.
      for (var r = 0; r < 4; r++) {
        tl.fromTo(q("row" + r), { x: ROW_FROM[r] }, { x: ROW_TO[r], duration: DUR - BEAT - r * 0.04, ease: "expo.out" }, BEAT + r * 0.04);
      }

      // Scene 3 (1.8s+): vignette closes in, wall dims under the type.
      tl.fromTo(q("vignette"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power4.out" }, 1.8);
      tl.fromTo(q("dim"), { opacity: 0 }, { opacity: 0.42, duration: 0.6, ease: "power3.out" }, 1.8);

      // "copy. paste. ship." — one word per beat, a different attack axis each.
      var W = [BEAT * 4, BEAT * 5, BEAT * 6];
      tl.fromTo(q("w1"), { opacity: 0, scale: 1.7, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, W[0]);
      tl.fromTo(q("w2"), { opacity: 0, x: 260 },
        { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, W[1]);
      tl.fromTo(q("w3"), { opacity: 0, y: 110, scale: 1.25 },
        { opacity: 1, y: 0, scale: 1, duration: 0.44, ease: "circ.out" }, W[2]);

      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
