  <script>
    (function () {
      var BEAT = 60 / 128; // 0.469s
      var tl = gsap.timeline({ paused: true });
      var scope = document.querySelector('[data-composition-id="02-own-the-components"]');
      var q = function (s) { return Array.prototype.slice.call(scope.querySelectorAll(s)); };

      var pieces = q(".f02-piece");
      var ghosts = q(".f02-ghost");

      // depth-scatter-assemble: index-derived cloud points (golden angle, stepped depth)
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      var RADIUS = 640, Z_NEAR = 380, Z_FAR = -420, TUMBLE = 70;
      var n = pieces.length;
      var scatter = pieces.map(function (el, i) {
        var a = i * GOLDEN;
        var depthT = n > 1 ? i / (n - 1) : 0;
        return {
          x: Math.cos(a) * RADIUS,
          y: Math.sin(a) * RADIUS * 0.72,
          z: Z_NEAR - depthT * (Z_NEAR - Z_FAR),
          rotationX: Math.sin(a) * TUMBLE,
          rotationY: Math.cos(a) * TUMBLE
        };
      });

      // ---- Scene 1 (0.0–1.2s): lime flood + mark assembles, impact on lock ----
      tl.fromTo("#f02-ground",
        { clipPath: "circle(0% at 30% 31%)" },
        { clipPath: "circle(120% at 30% 31%)", duration: 0.62, ease: "expo.out" }, 0);

      tl.fromTo("#f02-mark", { rotationY: -28 }, { rotationY: 0, duration: 0.9, ease: "power2.out" }, 0);

      var START = 0.06, STAGGER = 0.06, DUR = 0.64;
      pieces.forEach(function (el, i) {
        var s = scatter[i];
        var t0 = START + i * STAGGER;
        tl.fromTo(el,
          { x: s.x, y: s.y, z: s.z, rotationX: s.rotationX, rotationY: s.rotationY, filter: "blur(18px)" },
          { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, filter: "blur(0px)", duration: DUR, ease: "power4.out" }, t0);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, t0);
      });
      ghosts.forEach(function (el, i) {
        var s = scatter[i];
        var t0 = START + i * STAGGER + 0.07; // lagging echo = motion trail
        tl.fromTo(el,
          { x: s.x, y: s.y, z: s.z, rotationX: s.rotationX, rotationY: s.rotationY, filter: "blur(28px)" },
          { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, filter: "blur(6px)", duration: DUR, ease: "power4.out" }, t0);
        tl.fromTo(el, { opacity: 0 }, { opacity: 0.32, duration: 0.1, ease: "none" }, t0);
        tl.to(el, { opacity: 0, duration: 0.34, ease: "power2.out" }, t0 + 0.12);
      });

      // impact on the lock (beat 1.5)
      var LOCK = BEAT * 1.5; // ~0.70s
      tl.fromTo("#f02-mark", { scale: 1.09 }, { scale: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, LOCK);
      tl.set("#f02-ring", { scale: 0.35, opacity: 0 }, 0);
      tl.fromTo("#f02-ring", { scale: 0.35, opacity: 0.7 }, { scale: 2.1, opacity: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, LOCK);

      // ---- Scene 2 (1.2–1.9s): wordmark wipes out from behind the mark, rule + label snap ----
      tl.fromTo("#f02-word", { xPercent: -104 }, { xPercent: 0, duration: 0.62, ease: "expo.out" }, BEAT * 2.5); // ~1.17
      tl.fromTo("#f02-rule", { scaleY: 0 }, { scaleY: 1, duration: 0.36, ease: "expo.out" }, BEAT * 3); // ~1.41
      tl.fromTo("#f02-label", { yPercent: 110 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, BEAT * 3 + 0.06);

      // ---- Scene 3 (1.9–3.5s): scale-swap — lockup up and out, headline arrives on two beats ----
      var SWAP = BEAT * 3.5; // ~1.64
      tl.fromTo("#f02-lockup",
        { y: 0, scale: 1, opacity: 1, filter: "blur(0px)" },
        { y: -170, scale: 0.72, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power2.in", immediateRender: false }, SWAP);

      var L1 = BEAT * 4;   // ~1.875
      var L2 = BEAT * 5;   // ~2.344
      tl.fromTo("#f02-headline", { scale: 0.9 }, { scale: 1, duration: 1.5, ease: "expo.out" }, L1 - 0.12);
      tl.fromTo(q(".f02-w1"), { yPercent: 120 }, { yPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.06 }, L1);
      tl.fromTo(q(".f02-w2"), { yPercent: 120 }, { yPercent: 0, duration: 0.72, ease: "power4.out", stagger: 0.06 }, L2);

      // hold to the end of the shot (~0.8s still read)
